name: Cross-platform release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (master)
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            key: linux-x86_64
            ext: ''
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            key: linux-aarch64
            ext: ''
          - os: macos-15-intel
            target: x86_64-apple-darwin
            key: macos-x86_64
            ext: ''
          - os: macos-15
            target: aarch64-apple-darwin
            key: macos-aarch64
            ext: ''
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            key: windows-x86_64
            ext: .exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            key: windows-aarch64
            ext: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (master)
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: clippy
      - name: Check Unix installer syntax
        if: runner.os != 'Windows'
        run: sh -n scripts/install.sh scripts/local-smoke.sh scripts/test-linux-client.sh scripts/test-discord-restart.sh
      - name: Check PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
      - run: cargo clippy --locked --target ${{ matrix.target }} --all-targets -- -D warnings
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - shell: bash
        run: cp target/${{ matrix.target }}/release/dinmoo-proxy${{ matrix.ext }} dinmoo-proxy-${{ matrix.key }}${{ matrix.ext }}
      - name: Verify gateway admission and idle cleanup on loopback
        if: runner.os != 'Windows'
        shell: bash
        run: python3 scripts/test-gateway-protection.py "$PWD/dinmoo-proxy-${{ matrix.key }}"
      - name: Verify desktop restart ordering with process stubs
        if: runner.os == 'macOS'
        shell: bash
        run: sh scripts/test-discord-restart.sh "$PWD/dinmoo-proxy-${{ matrix.key }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.key }}
          path: dinmoo-proxy-${{ matrix.key }}${{ matrix.ext }}
          if-no-files-found: error

  publish:
    needs: [fmt, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksum manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path('dist')
          tag = os.environ['RELEASE_TAG']
          repository = os.environ['RELEASE_REPOSITORY']
          assets = {}
          for path in sorted(root.glob('dinmoo-proxy-*')):
              key = path.name.removeprefix('dinmoo-proxy-').removesuffix('.exe')
              assets[key] = {
                  'url': f'https://github.com/{repository}/releases/download/{tag}/{path.name}',
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
              }
          (root / 'SHA256SUMS').write_text(''.join(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n" for path in sorted(root.glob('dinmoo-proxy-*'))))
          (root / 'latest.json').write_text(json.dumps({'assets': assets}, indent=2) + '\n')
          PY
      - name: Include terminal installers
        run: |
          cp scripts/install.sh scripts/install.ps1 dist/
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
