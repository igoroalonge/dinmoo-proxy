[package]
name = "dinmoo-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
webpki-roots.workspace = true
subtle.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
base64 = "0.22"
x509-parser = { version = "0.18", features = ["verify"] }

[target.'cfg(target_os = "macos")'.dependencies]
tun = { version = "0.8", features = ["async"] }
ipstack = "=1.0.1"

# Voice peer ownership checks (src/peer.rs) and SO_EXCLUSIVEADDRUSE for the SOCKS listener.
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Security",
    "Win32_System_Threading",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

# Ignored CPU benchmarks (src/bench.rs) read process and thread CPU time.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2.191"
