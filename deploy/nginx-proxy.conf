# Install under nginx's http-context conf.d directory.
server {
    listen 8444 ssl;
    server_name proxy.dinmoo.com;
    root /srv/dinmoo-proxy;
    ssl_certificate /etc/letsencrypt/live/proxy.dinmoo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proxy.dinmoo.com/privkey.pem;
    location /releases/ {
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=300" always;
    }
}
