# Include at the top level of nginx.conf (not inside the http context).
# Requires nginx stream and ssl_preread modules.
stream {
    map $ssl_preread_server_name $dinmoo_backend {
        proxy.dinmoo.com 127.0.0.1:8444;
        api-proxy.dinmoo.com 127.0.0.1:8443;
        default 127.0.0.1:8444;
    }
    server {
        listen 443;
        proxy_pass $dinmoo_backend;
        ssl_preread on;
    }
}
